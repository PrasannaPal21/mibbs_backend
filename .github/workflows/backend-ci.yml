name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: .

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mibbs
          POSTGRES_PASSWORD: mibbs
          POSTGRES_DB: mibbs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mibbs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Both URLs point at the same CI Postgres (no pgbouncer here).
      # DIRECT_URL is required because prisma/schema.prisma now declares
      # `directUrl = env("DIRECT_URL")` for production (Neon) deploys.
      DATABASE_URL: postgresql://mibbs:mibbs@localhost:5432/mibbs_test?schema=public
      DIRECT_URL: postgresql://mibbs:mibbs@localhost:5432/mibbs_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ci-access-secret-do-not-use-in-prod-32chars
      JWT_REFRESH_SECRET: ci-refresh-secret-do-not-use-in-prod-32chars

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # PDF fonts are fetched at deploy time, not at CI time — we don't
      # exercise PDF generation in unit tests so we don't need them here.
